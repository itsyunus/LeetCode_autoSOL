<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LeetCode Session Renewal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090d18;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #f59e0b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #10b981;
      --red: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      color: #fff;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .step-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .step-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-portal {
      background: #2563eb;
      color: #fff;
      margin-bottom: 12px;
    }
    .btn-portal:active {
      background: #1d4ed8;
    }
    .btn-submit {
      background: var(--green);
      color: #fff;
    }
    .btn-submit:active {
      background: #059669;
    }
    textarea {
      width: 100%;
      height: 80px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #60a5fa;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 10px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .status-alert {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .status-err {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-ok {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <span class="badge">SESSION RECOVERY</span>
    </div>
    <h1>Renew LeetCode Session</h1>
    <p>Your previous session expired. Sign in below so your daily solver can automatically resume.</p>

    <div class="step-box">
      <div class="step-title">STEP 1: SIGN IN ON LEETCODE</div>
      <a href="https://leetcode.com/accounts/login/" target="_blank" class="btn btn-portal">
        Open LeetCode Login ↗
      </a>
      <small style="color:var(--muted);font-size:12px;display:block;text-align:center;">
        Sign in with your credentials, then return here.
      </small>
    </div>

    <div class="step-box">
      <div class="step-title">STEP 2: CONFIRM TOKENS</div>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">Paste cookie or session string:</label>
      <textarea id="cookieInput" placeholder="LEETCODE_SESSION=...; csrftoken=..."></textarea>
      <button id="sendBtn" class="btn btn-submit">
        ⚡ Transmit to Sentinel Bot
      </button>
      <div id="statusAlert" class="status-alert"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.MainButton.setText("SEND COOKIES TO BOT");
      tg.MainButton.onClick(handleSubmit);
    }

    document.getElementById("sendBtn").addEventListener("click", handleSubmit);

    function setStatus(msg, isError) {
      const el = document.getElementById("statusAlert");
      el.textContent = msg;
      el.className = "status-alert " + (isError ? "status-err" : "status-ok");
      el.style.display = "block";
    }

    function handleSubmit() {
      const text = document.getElementById("cookieInput").value.trim();
      if (!text) {
        setStatus("Please paste your session cookies first.", true);
        return;
      }

      let session = null;
      let csrf = null;

      const sessMatch = text.match(/LEETCODE_SESSION=([^;\s]+)/);
      const csrfMatch = text.match(/csrftoken=([^;\s]+)/);

      if (sessMatch) session = sessMatch[1];
      if (csrfMatch) csrf = csrfMatch[1];

      if (!session) {
        const tokens = text.split(/[\s;]+/);
        for (const tok of tokens) {
          const clean = tok.replace(/["';,]/g, "");
          if (clean.length > 50 && !session) session = clean;
          else if (clean.length >= 20 && !csrf) csrf = clean;
        }
      }

      if (!session) {
        setStatus("Could not detect a valid LEETCODE_SESSION string.", true);
        return;
      }

      const payload = {
        session: session,
        csrf: csrf || "valid_csrf"
      };

      setStatus("Transmitting fresh credentials to Sentinel Bot...", false);

      if (tg && typeof tg.sendData === "function") {
        tg.sendData(JSON.stringify(payload));
        setTimeout(() => {
          tg.close();
        }, 500);
      } else {
        setStatus("✅ Ready! Copied to clipboard. Paste it directly into your Telegram chat.", false);
        navigator.clipboard.writeText(JSON.stringify(payload));
      }
    }
  </script>
</body>
</html>

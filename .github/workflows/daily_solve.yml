# ─────────────────────────────────────────────────────────────
# GitHub Actions: LeetCode Daily Auto-Solver
# ─────────────────────────────────────────────────────────────

name: 🧠 LeetCode Daily Auto-Solver

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate but don't submit)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      language:
        description: "Solution language"
        required: false
        default: "python3"
        type: choice
        options: [python3, java, cpp, javascript, typescript, go, rust]

permissions:
  contents: write

jobs:
  solve-daily:
    name: 🎯 Solve Today's Challenge
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright PyNaCl
          playwright install chromium --with-deps
          mkdir -p logs

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Automatic credential refresh is disabled; only existing repository secrets are used.

      # ── Solutions DB Cache ─────────────────────────────────
      - name: 💾 Cache solutions database
        uses: actions/cache@v5
        with:
          path: |
            solutions_db/
            .repos/
          key: solutions-db-v1-${{ hashFiles('solutions_db/_master_index.json') }}
          restore-keys: solutions-db-v1-

      - name: 📥 Download bulk solutions database
        continue-on-error: true
        run: |
          if [ ! -f "solutions_db/_master_index.json" ] || \
             [ $(find solutions_db/_master_index.json -mtime +7 2>/dev/null | wc -l) -gt 0 ]; then
            echo "📥 Downloading solutions database..."
            python -m src.bulk_downloader
          else
            echo "✅ Solutions DB is fresh"
          fi

      # ── Solve — uses GITHUB_ENV tokens if refreshed, otherwise falls back to secrets ──
      - name: 🧠 Solve daily challenge
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          SOLUTION_LANGUAGE: ${{ github.event.inputs.language || 'python3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_IF_SOLVED: "true"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        run: |
          if [ -z "$LEETCODE_SESSION" ] || [ -z "$LEETCODE_CSRF_TOKEN" ]; then
            echo "❌ No LeetCode tokens available."
            echo "Set LEETCODE_SESSION and LEETCODE_CSRF_TOKEN in your repo's Actions secrets."
            echo ""
            echo "How to get them:"
            echo "  1. Log into leetcode.com in your browser"
            echo "  2. Open DevTools → Application → Cookies → leetcode.com"
            echo "  3. Copy LEETCODE_SESSION and csrftoken values"
            echo "  4. Add them as repository secrets in GitHub Settings → Secrets → Actions"
            exit 1
          fi
          python -m src.main

      - name: 🫀 Post-solve cookie capture
        if: success()
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pip install PyNaCl -q
          python3 -c "
          from src.session_keeper import post_solve_cookie_refresh
          post_solve_cookie_refresh()
          " || echo "⚠️ Cookie capture skipped (non-critical)"

      - name: Generate progress dashboard
        if: always()
        run: python -m src.dashboard

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leetcode-progress-dashboard-${{ github.run_number }}
          path: dashboard/index.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Add execution summary
        if: always()
        run: |
          {
            echo "## LeetCode Auto-Solver"
            echo ""
            echo "- Workflow: \`${{ github.workflow }}\`"
            echo "- Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Dashboard and solver logs are attached under this run's **Artifacts** section."
            echo "- Dry run: \`${{ github.event.inputs.dry_run || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📋 Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: solver-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

# ─────────────────────────────────────────────────────────────
# GitHub Actions: LeetCode Daily Auto-Solver
# ─────────────────────────────────────────────────────────────

name: 🧠 LeetCode Daily Auto-Solver

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate but don't submit)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      language:
        description: "Solution language"
        required: false
        default: "python3"
        type: choice
        options: [python3, java, cpp, javascript, typescript, go, rust]

permissions:
  contents: write

jobs:
  solve-daily:
    name: 🎯 Solve Today's Challenge
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright PyNaCl
          playwright install chromium --with-deps
          mkdir -p logs

      # ── Token Refresh — logs in and exports fresh tokens ───
      - name: 🔄 Auto-refresh LeetCode tokens
        env:
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_PASSWORD: ${{ secrets.LEETCODE_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$LEETCODE_USERNAME" ] || [ -z "$LEETCODE_PASSWORD" ] || [ -z "$GH_PAT" ]; then
            echo "❌ Set LEETCODE_USERNAME, LEETCODE_PASSWORD, and GH_PAT in repository Actions secrets."
            echo "The solver will not continue with an expired session."
            exit 1
          fi
          echo "🔄 Logging into LeetCode and validating fresh tokens..."
          python -m src.token_refresher

      # ── Solutions DB Cache ─────────────────────────────────
      - name: 💾 Cache solutions database
        uses: actions/cache@v5
        with:
          path: |
            solutions_db/
            .repos/
          key: solutions-db-v1-${{ hashFiles('solutions_db/_master_index.json') }}
          restore-keys: solutions-db-v1-

      - name: 📥 Download bulk solutions database
        continue-on-error: true
        run: |
          if [ ! -f "solutions_db/_master_index.json" ] || \
             [ $(find solutions_db/_master_index.json -mtime +7 2>/dev/null | wc -l) -gt 0 ]; then
            echo "📥 Downloading solutions database..."
            python -m src.bulk_downloader
          else
            echo "✅ Solutions DB is fresh"
          fi

      # ── Solve — only runs after successful login and token validation ──
      - name: 🧠 Solve daily challenge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
          SOLUTION_LANGUAGE: ${{ github.event.inputs.language || 'python3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_IF_SOLVED: "true"
        run: |
          if [ -z "$LEETCODE_SESSION" ] || [ -z "$LEETCODE_CSRF_TOKEN" ]; then
            echo "❌ Token refresh did not provide both LeetCode cookies."
            exit 1
          fi
          python -m src.main

      - name: 📋 Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: solver-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore


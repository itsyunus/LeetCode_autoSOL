# ─────────────────────────────────────────────────────────────
# GitHub Actions: LeetCode Session Keep-Alive
# ─────────────────────────────────────────────────────────────
# Runs on GitHub-hosted infrastructure every hour; no personal device is required.
# This is an authentication health check, not a guaranteed session extender.
# If LeetCode itself rotates cookies in a response, captures them and updates secrets.
#
# No login. No CAPTCHA. No local machine needed.
# ─────────────────────────────────────────────────────────────

name: 🫀 Session Keep-Alive

on:
  schedule:
    # Every hour on GitHub-hosted runners
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: 🫀 Keep Session Alive
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: pip install requests PyNaCl

      - name: 🫀 Probe & Refresh Session
        id: keepalive
        env:
          LEETCODE_COOKIE_BUNDLE: ${{ secrets.LEETCODE_COOKIE_BUNDLE }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.session_keeper

      - name: 📧 Alert on Session Death
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 << 'PYEOF'
          import os, smtplib, sys
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime, timezone

          smtp_user = os.environ.get("SMTP_USER", "")
          smtp_pass = os.environ.get("SMTP_PASSWORD", "")
          to_email = os.environ.get("NOTIFICATION_EMAIL", "")
          run_num = os.environ.get("RUN_NUMBER", "?")

          if not all([smtp_user, smtp_pass, to_email]):
              print("⚠️  Email not configured — skipping alert")
              sys.exit(0)

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"🚨 LeetCode Session Dead — {now}"
          msg["From"] = smtp_user
          msg["To"] = to_email

          html = f"""
          <div style="font-family:system-ui;max-width:520px;margin:auto;padding:24px;background:#0d1117;color:#e6edf3;border-radius:16px;border:1px solid #30363d">
            <h2 style="color:#f85149;margin-top:0">🚨 Session Expired</h2>
            <p>The keep-alive check at <b>{now}</b> could not verify or maintain the LeetCode session.</p>
            <p>Check workflow logs to distinguish an expired login from a temporary network/API failure or GitHub Secret permission issue. The daily auto-solver may fail until resolved.</p>

            <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;margin:16px 0">
              <h3 style="color:#58a6ff;margin-top:0">Fix in 30 seconds:</h3>
              <ol style="padding-left:20px">
                <li>Open <a href="https://leetcode.com" style="color:#58a6ff">leetcode.com</a> and log in</li>
                <li>Open DevTools (F12) &gt; Application &gt; Cookies</li>
                <li>Copy <b>LEETCODE_SESSION</b> and <b>csrftoken</b></li>
                <li>Update them in <a href="https://github.com/itsyunus/LeetCode_autoSOL/settings/secrets/actions" style="color:#58a6ff">GitHub Secrets</a></li>
              </ol>
            </div>

            <p style="color:#8b949e;font-size:12px;margin-bottom:0">
              Sent by Session Keep-Alive — Run #{run_num}
            </p>
          </div>
          """
          msg.attach(MIMEText(html, "html"))

          try:
              host = os.environ.get("SMTP_HOST", "smtp.gmail.com")
              port = int(os.environ.get("SMTP_PORT", "587"))
              with smtplib.SMTP(host, port) as server:
                  server.starttls()
                  server.login(smtp_user, smtp_pass)
                  server.sendmail(smtp_user, to_email, msg.as_string())
              print(f"📧 Alert sent to {to_email}")
          except Exception as e:
              print(f"⚠️  Email failed: {e}")
          PYEOF

      - name: 📲 Mobile alert on session or Cloudflare failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_MESSAGE: "LeetCode session preflight/keep-alive failed. Check the latest GitHub Actions run; if Cloudflare challenged the runner, manually sign in and push a fresh cookie bundle."
        run: python -m src.notify

      - name: 📲 Mobile alert on keep-alive failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_MESSAGE: "LeetCode keep-alive failed. Open the latest GitHub Actions run. If Cloudflare challenged the runner, sign in normally and push a fresh cookie bundle from the extension."
        run: python -m src.notify

      - name: 📊 Summary
        if: always()
        run: |
          {
            echo "## 🫀 Session Keep-Alive"
            echo ""
            if [ "${{ steps.keepalive.outcome }}" = "success" ]; then
              echo "✅ **Session is alive.** Cookies probed and any rotations captured."
            else
              echo "⚠️ **Session check failed.** Inspect logs: login expiry, network/API failure, or secret-update permission failure."
              echo ""
              echo "If logs explicitly report isSignedIn=False, log in to LeetCode and refresh LEETCODE_SESSION + LEETCODE_CSRF_TOKEN in [GitHub Secrets](https://github.com/itsyunus/LeetCode_autoSOL/settings/secrets/actions)."
              echo "If logs report GH_PAT permission errors, grant repository Secrets: read/write permission to GH_PAT (fine-grained token), or repo scope for a classic token."
            fi
            echo ""
            echo "- Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Schedule: Every hour on GitHub-hosted runners (24x/day; health check only)"
          } >> "$GITHUB_STEP_SUMMARY"
